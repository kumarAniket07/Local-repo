<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Deliver</title>

<style>

/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* Body */
body{
    background-color:#f9faf9;
    color:#1d1c1c;
}

/* Header */
header{
    background-color:#78e237;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
}

header h1{
    font-size:32px;
}

/* Navigation */
nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:18px;
    transition:0.3s;
}

nav a:hover{
    color:#eaffd6;
}

/* Main Section */
main{
    text-align:center;
    padding:100px 20px;
}

main h2{
    color:#46a312;
    font-size:42px;
    margin-bottom:20px;
}

main p{
    font-size:20px;
    color:#555;
    max-width:600px;
    margin:auto;
    line-height:1.6;
}

/* Footer */
footer{
    background-color:#78e237;
    color:white;
    text-align:center;
    padding:15px;
    position:fixed;
    bottom:0;
    width:100%;
}

</style>
</head>

<body>

<header>
    <h1>Quick Deliver</h1>

    <nav>
        <a href="/home">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </nav>
</header>

<main>
    <h2>Order Food Anytime and Anywhere</h2>

    <p>
        Download the app now!  
        Experience seamless online ordering only on the Quick Deliver app.
    </p>
</main>

<footer>
    © 2026 Quick Deliver
</footer>

</body>
</html>
